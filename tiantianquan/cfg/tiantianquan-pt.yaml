# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPCSPC, [1024, 5]] # 9

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, BiFPN_Concat2, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, BiFPN_Concat2, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  # 【新增的P2分支】
  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ] # 16-P3上采样 (80→160)
  # args=[None,2,"nearest"] → 80→160，第16层（P3上采样到P2尺度）
  - [ [ -1, 2 ], 1, BiFPN_Concat2, [ 1 ] ] # 17-拼接P3上采样+P2 (128+128=256通道)
  # from=[-1,2] → 第16层（P3上采样）+第2层（P2）；
  # args=[1] → 通道拼接，128+128=256，第17层
  - [ -1, 3, C2f, [ 128 ] ] # 18-P2融合后增强 (P2/4-tiny)
  # args=[128] → 256→128通道，第18层（你的P2检测头核心输入）

  # 【新增的P2下采样分支】
  - [ -1, 1, Conv, [ 128, 3, 2 ] ] # 19-P2下采样 (160→80)
  # from=-1 → 输入是第18层（P2增强后）；
  # args=[128,3,2] → 输出128通道，3×3卷积，步长2（160→80），第19层
  - [ [ -1, 15 ], 1, BiFPN_Concat2, [ 1 ] ] # 20-拼接P2下采样+P3 (128+256=384通道)
  # from=[-1,15] → 第19层（P2下采样）+第15层（P3融合后）；
  # args=[1] → 通道拼接，128+256=384，第20层
  - [ -1, 3, C2f, [ 256 ] ] # 21-P3最终增强 (P3/8-small)
  # args=[256] → 384→256通道，第21层（P3检测头输入）

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, BiFPN_Concat2, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, BiFPN_Concat2, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large)

  - [ [ 18, 21, 24, 27 ], 1, Detect, [ nc ] ] # Detect(P2, P3, P4, P5)
  # from=[18,21,24,27] → 输入是第18层（P2）+21层（P3）+24层（P4）+27层（P5）；
  # repeats=1 → 1次Detect模块；
  # args=[nc] → 检测类别数=nc=5；
  # 核心：你把原3层检测（[15,18,21]）改成4层（[18,21,24,27]），对应P2/P3/P4/P5四个检测头
